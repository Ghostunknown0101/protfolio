    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("portfolio:settings") || "{}").state || {};
          var legacy = localStorage.getItem("theme");
          var a = s.appearance || (legacy === "dark" || legacy === "light" ? legacy : "auto");
          var dark = a === "dark" || (a === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
        // A visitor who picked Persian before gets it from the first paint.
        try {
          var l = localStorage.getItem("portfolio:locale");
          if (l === "fa" || (!l && /^fa/i.test(navigator.language || ""))) {
            document.documentElement.lang = "fa";
            document.documentElement.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
